<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La porra de Catalina</title>
<meta name="description" content="¿Qué día nacerá Catalina? La porra de la familia.">
<meta name="theme-color" content="#EDF1F7">
<meta property="og:title" content="La porra de Catalina">
<meta property="og:description" content="¿Qué día nacerá Catalina? La porra de la familia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 262'><path d='M88 22 Q120 50 152 22 L194 34 Q214 46 230 78 L202 100 L186 86 L186 188 Q186 214 160 226 L148 250 L92 250 L80 226 Q54 214 54 188 L54 86 L38 100 L10 78 Q26 46 46 34 Z' fill='%23F4B6C8' stroke='%231E2B4A' stroke-width='14' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF1F7;   /* azul sábana */
    --white:#FFFFFF;
    --ink:#1E2B4A;     /* tinta de boli */
    --muted:#5D6883;
    --rule:#C9D2E1;
    --pink:#F4B6C8;    /* el body */
    --pen:#AD456A;     /* boli rosa (oscurecido para pasar AA sobre papel y blanco) */
    --marker:#FFD84D;  /* subrayador */
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --text:"Atkinson Hyperlegible",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 var(--text);-webkit-font-smoothing:antialiased}
  main{max-width:1040px;margin:0 auto;padding:0 16px 56px}
  :focus-visible{outline:3px solid var(--pen);outline-offset:3px}
  ::selection{background:var(--marker);color:var(--ink)}

  /* ---------- Cabecera con la cuerda de tender ---------- */
  .hero{position:relative;display:grid;grid-template-columns:280px minmax(0,1fr) 196px;gap:8px 40px;align-items:end;padding-top:18px;margin-bottom:56px}
  .rope{position:absolute;left:-16px;width:340px;top:36px;height:2px;background:var(--ink);opacity:.35}
  .hang{position:relative;width:100%;transform-origin:50% 0}
  .onesie{display:block;width:100%;height:auto;overflow:visible}
  .intro{padding-bottom:6px}
  h1{font:800 clamp(2.5rem,6vw,4.2rem)/.95 var(--display);letter-spacing:-.025em;margin:0 0 20px;max-width:12ch;text-wrap:balance}
  .status{font-size:1.25rem;margin:0 0 6px;max-width:40ch}
  .sub{color:var(--muted);margin:0;max-width:44ch}
  .print{margin-top:20px;font:700 1rem var(--text);color:var(--white);background:var(--ink);border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
  .print:hover{background:#2c3c63}
  .print:active{transform:translateY(1px)}

  /* La ecografía pegada en la nevera con un trozo de celo */
  .eco{position:relative;margin:0 0 6px;justify-self:end;width:100%;transform:rotate(2.5deg)}
  .eco::before{content:"";position:absolute;z-index:1;top:-11px;left:50%;width:78px;height:24px;margin-left:-39px;background:rgba(255,255,255,.62);border-left:1px dashed rgba(30,43,74,.18);border-right:1px dashed rgba(30,43,74,.18);transform:rotate(-4deg)}
  .eco-print{background:#0b0b0d;padding:10px 10px 12px}
  .eco video{display:block;width:100%;height:auto;aspect-ratio:4 / 5;object-fit:cover;background:#0b0b0d}
  .eco figcaption{font:700 .95rem/1.25 var(--display);color:var(--pen);margin-top:10px;transform:rotate(-2.5deg)}

  @media (prefers-reduced-motion:no-preference){
    .hang{animation:sway 2.6s cubic-bezier(.3,.7,.4,1) both}
    @keyframes sway{0%{transform:rotate(-6deg)}35%{transform:rotate(4deg)}65%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
  }

  /* ---------- Calendario de nevera ---------- */
  .cal-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:14px}
  h2{font:700 1.6rem/1.1 var(--display);letter-spacing:-.01em;margin:0}
  .key{color:var(--muted);font-size:.95rem;margin:0;display:flex;flex-wrap:wrap;gap:4px 18px}
  .key span{white-space:nowrap}
  .key .k-ring{position:relative;padding:0 6px;margin-right:8px}
  .key .k-out{text-decoration:line-through;text-decoration-thickness:2px}
  .key .k-win{background:linear-gradient(transparent 52%,var(--marker) 52%);color:var(--ink);padding:0 2px}

  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--ink)}
  .wd{font:700 .9rem var(--display);color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--rule)}
  .day{position:relative;min-height:118px;padding:10px 10px 12px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
  .day:nth-child(7n){border-right:0}
  .day.has{background:var(--white)}
  .day.today{background:var(--white);box-shadow:inset 0 0 0 3px var(--ink)}
  .dh{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
  .num{position:relative;font:700 1.5rem/1 var(--display);min-width:1.3em}
  .ring{position:absolute;left:-12px;top:-10px;width:calc(100% + 24px);height:calc(100% + 20px);overflow:visible;pointer-events:none}
  .ring path{fill:none;stroke:var(--pen);stroke-width:2.5;stroke-linecap:round}
  .wdm{display:none;color:var(--muted);font-size:.95rem}
  .mon{color:var(--muted);font-size:.95rem}
  .num:has(.ring) + .mon{margin-left:8px}  /* que el círculo de la fecha prevista no tape el mes */
  .notes{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:.9rem;color:var(--muted);margin-bottom:6px}
  .notes .hoy{color:var(--ink);font-weight:700}
  .notes .fpp{color:var(--pen);font-weight:700}
  .notes .nacio{color:var(--pen);font-weight:700}
  .names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .names li{display:flex;align-items:center;gap:8px;font-weight:700;line-height:1.25}
  .av{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--pink);color:var(--ink);font:800 .95rem/30px var(--display);text-align:center;box-shadow:0 0 0 1.5px var(--ink)}
  .names .nm{min-width:0}
  .names li.out{color:var(--muted);font-weight:400}
  .names li.out .t{text-decoration:line-through;text-decoration-thickness:2px}
  .names li.out .av{filter:grayscale(1);opacity:.55;box-shadow:0 0 0 1.5px var(--muted)}
  /* El subrayador se repite en cada línea cuando el nombre ocupa dos */
  .names li.win .t{background:linear-gradient(transparent 50%,var(--marker) 50%);padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .names li.win .av{box-shadow:0 0 0 3px var(--marker),0 0 0 4.5px var(--ink)}
  .day.past .num,.day.past .mon{color:var(--muted)}
  .day.born{background:var(--white)}

  .count{margin:18px 0 0;color:var(--muted)}

  /* Móvil: el calendario se convierte en lista de días */
  @media (min-width:701px){ .num{min-width:0} }
  @media (max-width:700px){
    .hero{grid-template-columns:1fr;gap:20px;margin-bottom:40px}
    .eco{justify-self:center;width:min(200px,58%);margin:14px 0 4px}
    .hang{width:210px;margin-left:8px}
    .rope{top:36px;width:auto;right:-16px}
    .cal{grid-template-columns:1fr}
    .wd,.pad{display:none}
    .day{min-height:0;border-right:0;display:grid;grid-template-columns:112px 1fr;column-gap:12px;padding:12px 8px}
    .dh{grid-row:1 / span 2;flex-wrap:nowrap;margin:0;gap:8px;white-space:nowrap}
    .wdm{min-width:2.1em}
    .ring{left:-8px;width:calc(100% + 16px)}
    .wdm{display:inline}
    .day .mon{display:inline}
    .notes{margin-bottom:2px}
    .names{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
    .day.empty .notes:empty{display:none}
  }
  @media (min-width:701px) and (max-width:960px){
    .hero{grid-template-columns:240px minmax(0,1fr)}
    .eco{grid-column:2;justify-self:start;width:196px;margin-top:24px}
  }

  /* ---------- Cartel para imprimir ---------- */
  .poster{display:none}
  @media print{
    @page{size:A4 portrait;margin:14mm}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    main{display:none}
    .poster{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(297mm - 28mm);text-align:center}
    .poster svg{width:150mm;height:auto;overflow:visible}
    .poster p{font:700 24pt/1.2 var(--display);margin:8mm 0 0}
    .poster small{display:block;font:400 15pt var(--text);color:var(--muted);margin-top:3mm}
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="rope" aria-hidden="true"></div>
    <div class="hang"><svg id="onesie" class="onesie" viewBox="0 0 240 262" role="img" aria-label="Body de bebé"></svg></div>
    <div class="intro">
      <h1 id="title">¿Qué día nacerá Catalina?</h1>
      <p id="status" class="status"></p>
      <p id="sub" class="sub"></p>
      <button id="print" class="print" type="button" hidden>Imprimir el cartel</button>
    </div>
    <figure class="eco">
      <div class="eco-print">
        <video src="assets/ecografia.mp4" poster="assets/ecografia.jpg" width="480" height="600" autoplay muted loop playsinline preload="metadata" aria-label="Vídeo de la ecografía de Catalina"></video>
      </div>
      <figcaption id="ecoCap">Catalina, en la ecografía</figcaption>
    </figure>
  </header>

  <section aria-labelledby="cal-title">
    <div class="cal-head">
      <h2 id="cal-title">Las apuestas</h2>
      <p class="key">
        <span><span class="k-ring" id="keyRing"></span> salimos de cuentas</span>
        <span><span class="k-out">Nombre</span> ese día ya pasó</span>
        <span><span class="k-win">Nombre</span> acertó</span>
      </p>
    </div>
    <div id="cal" class="cal"></div>
    <p id="count" class="count"></p>
  </section>
</main>

<div id="poster" class="poster" aria-hidden="true"></div>

<script>
/* ============================================================
   CONFIGURACIÓN: lo único que hace falta tocar
   ============================================================ */
const CONFIG = {
  bebe: "Catalina",
  fpp: "2026-12-30",       // fecha en la que salimos de cuentas
  nacimiento: null,        // cuando nazca: "AAAA-MM-DD", p. ej. "2026-12-28"
  // foto (opcional): ruta a la imagen, p. ej. "assets/fotos/rafael.jpg".
  // Mejor cuadrada y pequeña (unos 120×120 px). Sin foto se ve la inicial.
  participantes: [
    { nombre: "Rafael",          fecha: "2026-12-21" },
    { nombre: "Sandra",          fecha: "2026-12-24" },
    { nombre: "Jesús",           fecha: "2026-12-24" },
    { nombre: "Adriana",         fecha: "2026-12-27" },
    { nombre: "Raquel (abuela)", fecha: "2026-12-28" },
    { nombre: "Ángela",          fecha: "2026-12-30" },
    { nombre: "Marga",           fecha: "2026-12-31" },
    { nombre: "Víctor",          fecha: "2027-01-01" },
    { nombre: "José",            fecha: "2027-01-02" },
    { nombre: "Javito",          fecha: "2027-01-02" },
    { nombre: "Sheila",          fecha: "2027-01-02" },
    { nombre: "Paloma",          fecha: "2027-01-03" },
    { nombre: "Fer",             fecha: "2027-01-05" },
    { nombre: "Raquel (tía)",    fecha: "2027-01-06" },
  ],
  fiestas: {
    "2026-12-24": "Nochebuena",
    "2026-12-25": "Navidad",
    "2026-12-28": "Inocentes",
    "2026-12-31": "Nochevieja",
    "2027-01-01": "Año Nuevo",
    "2027-01-06": "Reyes",
  },
};

/* ============================================================ */
const Q = new URLSearchParams(location.search);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const list = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
const long = s => parse(s).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }).replace(",", "");
const full = s => parse(s).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });

// Para probar: ?hoy=2026-12-29  ·  ?nacimiento=2026-12-24
const today = isISO(Q.get("hoy")) ? Q.get("hoy") : key(new Date());
const born = isISO(Q.get("nacimiento")) ? Q.get("nacimiento") : CONFIG.nacimiento;
const B = CONFIG.bebe;

const people = [...CONFIG.participantes].sort((a, b) => a.fecha.localeCompare(b.fecha));
const byDate = {};
people.forEach(p => (byDate[p.fecha] = byDate[p.fecha] || []).push(p));
const winners = born ? people.filter(p => p.fecha === born) : [];
// Foto de cada participante; si aún no hay foto, un círculo con la inicial
const avatar = p => p.foto
  ? `<img class="av" src="${esc(p.foto)}" alt="" width="30" height="30" loading="lazy">`
  : `<span class="av" aria-hidden="true">${esc(p.nombre.charAt(0))}</span>`;
const state = p => born ? (p.fecha === born ? "win" : "out") : (p.fecha < today ? "out" : "live");

/* ---------- El body ---------- */
const BODY = "M88 22 Q120 50 152 22 L194 34 Q214 46 230 78 L202 100 L186 86 L186 188 Q186 214 160 226 L148 250 L92 250 L80 226 Q54 214 54 188 L54 86 L38 100 L10 78 Q26 46 46 34 Z";
function drawOnesie(svg, lines) {
  svg.innerHTML = `
    <path d="${BODY}" fill="var(--pink)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    <clipPath id="${svg.id || "p"}-clip"><path d="${BODY}"/></clipPath>
    <g clip-path="url(#${svg.id || "p"}-clip)"><path d="${BODY}" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 5" opacity=".45" transform="translate(120 140) scale(.9) translate(-120 -140)"/></g>
    <g fill="#fff" stroke="var(--ink)" stroke-width="1.5"><circle cx="106" cy="240" r="3.2"/><circle cx="120" cy="240" r="3.2"/><circle cx="134" cy="240" r="3.2"/></g>
    <g fill="var(--white)" stroke="var(--ink)" stroke-width="2"><rect x="60" y="2" width="12" height="40" rx="3" transform="rotate(-8 66 22)"/><rect x="168" y="2" width="12" height="40" rx="3" transform="rotate(8 174 22)"/></g>
    <g class="txt" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="middle">
      ${lines.map(l => `<text x="120">${esc(l)}</text>`).join("")}
    </g>`;
  fitText(svg, lines.length);
}
function fitText(svg, n) {
  const texts = [...svg.querySelectorAll(".txt text")];
  const maxW = 118, maxH = 112, cy = 150;
  let size = n === 1 && texts[0].textContent.length <= 2 ? 84 : 40;
  const apply = s => texts.forEach((t, i) => { t.setAttribute("font-size", s); t.setAttribute("y", cy - ((n - 1) * s * 1.05) / 2 + i * s * 1.05 + s * .35); });
  apply(size);
  for (let guard = 0; guard < 40; guard++) {
    const w = Math.max(...texts.map(t => t.getComputedTextLength ? t.getComputedTextLength() : 0));
    if ((w <= maxW && n * size * 1.05 <= maxH) || size <= 10) break;
    size = Math.max(10, Math.floor(size * Math.min(1, maxW / (w || 1), maxH / (n * size * 1.05)) - 1));
    apply(size);
  }
}

/* ---------- Texto de cabecera ---------- */
const $ = id => document.getElementById(id);
document.title = `La porra de ${B}`;
$("ecoCap").textContent = `${B}, en la ecografía`;
$("title").textContent = born ? `${B} ya está aquí` : `¿Qué día nacerá ${B}?`;
let onesieLines = ["?"];

if (born) {
  $("status").textContent = `${B} nació el ${long(born)}.`;
  if (winners.length) {
    const names = winners.map(w => w.nombre);
    $("sub").textContent = `${names.length > 1 ? "Acertaron" : "Acertó"} ${list(names)}, así que ${names.length > 1 ? "se hacen" : "se hace"} la foto con ${B} y el cartel.`;
    onesieLines = names;
  } else {
    $("sub").textContent = `Nadie acertó el día, así que la porra la gana ella.`;
    onesieLines = ["La gané", "yo"];
  }
  $("print").hidden = false;
} else {
  const d = diff(today, CONFIG.fpp);
  $("status").textContent =
    d > 1 ? `Salimos de cuentas el ${long(CONFIG.fpp)}, dentro de ${d} días.` :
    d === 1 ? `Salimos de cuentas mañana, ${long(CONFIG.fpp)}.` :
    d === 0 ? `Hoy salimos de cuentas.` :
    `Salíamos de cuentas el ${long(CONFIG.fpp)}. Llevamos ${-d} ${-d === 1 ? "día" : "días"} de propina.`;
  $("sub").textContent = `Quien acierte el día exacto se hará la foto con ${B} llevando un cartel con su nombre.`;
}

/* ---------- Calendario ---------- */
(function calendar() {
  const keys = people.map(p => p.fecha).concat(CONFIG.fpp, born ? [born] : []).sort();
  const first = parse(keys[0]), last = parse(keys[keys.length - 1]);
  const start = addDays(first, -((first.getDay() + 6) % 7));
  const end = addDays(last, 6 - ((last.getDay() + 6) % 7));
  const wds = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
  const ring = `<svg class="ring" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M58 6 C30 2 6 12 5 30 C4 50 30 58 55 56 C82 54 97 42 95 26 C93 10 70 3 44 7"/></svg>`;
  let html = wds.map(w => `<div class="wd">${w}</div>`).join("");
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const k = key(d), bets = byDate[k] || [];
    const isPast = born ? k !== born : k < today;
    const cls = ["day", bets.length ? "has" : "empty",
      !born && k === today ? "today" : "", k === born ? "born" : "",
      isPast ? "past" : ""].filter(Boolean).join(" ");
    const notes = [];
    if (!born && k === today) notes.push(`<span class="hoy">Hoy</span>`);
    if (k === born) notes.push(`<span class="nacio">Nació</span>`);
    if (k === CONFIG.fpp) notes.push(`<span class="fpp">Salimos de cuentas</span>`);
    if (CONFIG.fiestas[k]) notes.push(`<span>${CONFIG.fiestas[k]}</span>`);
    const mon = d.toLocaleDateString("es-ES", { month: "short" }).replace(".", "");
    html += `<div class="${cls}">
      <div class="dh"><span class="wdm">${wds[(d.getDay() + 6) % 7]}</span><span class="num">${d.getDate()}${k === CONFIG.fpp ? ring : ""}</span><span class="mon">${mon}</span></div>
      <div class="notes">${notes.join("")}</div>
      ${bets.length ? `<ul class="names">${bets.map(b => `<li class="${state(b)}">${avatar(b)}<span class="nm"><span class="t">${esc(b.nombre)}</span></span></li>`).join("")}</ul>` : ""}
    </div>`;
  }
  $("cal").innerHTML = html;
  // En la leyenda, la fecha prevista con su mes: «30 dic.»
  const f = parse(CONFIG.fpp);
  $("keyRing").innerHTML = `${f.getDate()} ${f.toLocaleDateString("es-ES", { month: "short" }).replace(".", "")}.${ring}`;
})();

/* ---------- Recuento ---------- */
(function count() {
  const n = people.length, live = people.filter(p => state(p) === "live").length;
  $("count").textContent = born ? `${n} apuestas en total.` :
    live === n ? `Hay ${n} apuestas y todas siguen en juego.` :
    live === 0 ? `Ya no queda ninguna apuesta en juego.` :
    `Siguen en juego ${live} de las ${n} apuestas.`;
})();

/* ---------- Dibujo y cartel ---------- */
function render() {
  drawOnesie($("onesie"), onesieLines);
  if (born) {
    const poster = $("poster");
    // El cartel copia el body ya ajustado (oculto no se puede medir el texto)
    const svg = $("onesie").outerHTML.replaceAll("onesie-clip", "poster-clip").replace('id="onesie"', 'id="poster-onesie"');
    poster.innerHTML = `${svg}
      <p>${winners.length ? (winners.length > 1 ? "Acertaron el día" : "Acertó el día") : "Nadie acertó el día"}<small>${esc(B)}, ${full(born)}</small></p>`;
  }
}
render();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
$("print").addEventListener("click", () => window.print());
</script>
</body>
</html>
